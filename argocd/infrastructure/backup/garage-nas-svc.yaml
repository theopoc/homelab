apiVersion: v1
kind: Service
metadata:
  name: s3-nas
  namespace: "longhorn-system"
  annotations:
    # Temporary recovery relay: MacBook Tailscale Serve forwards this port to
    # Garage on the NAS LAN address while the NAS node key is expired.
    tailscale.com/tailnet-ip: "100.85.77.101"
spec:
  type: ClusterIP
  ports:
    - name: s3
      port: 3900
      targetPort: 3900
