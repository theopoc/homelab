apiVersion: apps/v1
kind: Deployment
metadata:
  name: opengym
  namespace: opengym
  labels:
    app.kubernetes.io/name: opengym
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: opengym
  template:
    metadata:
      labels:
        app.kubernetes.io/name: opengym
    spec:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: fetch-exercise-media
          image: alpine/git:2.49.1@sha256:c0280cf9572316299b08544065d3bf35db65043d5e3963982ec50647d2746e26
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
          args:
            - |
              dataset_ref=7455efae41b330c265e7cd4b78dfa848e7ce5ebd
              marker="/media/.dataset-${dataset_ref}"
              work_dir="/media/.staging-${dataset_ref}"

              if [ -f "$marker" ]; then
                echo "Exercise media already present for ${dataset_ref}."
                exit 0
              fi

              rm -rf "$work_dir"
              git init "$work_dir"
              git -C "$work_dir" remote add origin https://github.com/hasaneyldrm/exercises-dataset.git
              git -C "$work_dir" fetch --depth 1 origin "$dataset_ref"
              git -C "$work_dir" checkout --detach FETCH_HEAD

              image_count="$(find "$work_dir/images" -maxdepth 1 -type f -name '*.jpg' | wc -l)"
              gif_count="$(find "$work_dir/videos" -maxdepth 1 -type f -name '*.gif' | wc -l)"
              test "$image_count" -gt 1000
              test "$gif_count" -gt 1000

              mkdir -p /media/img /media/gif
              cp "$work_dir"/images/*.jpg /media/img/
              cp "$work_dir"/videos/*.gif /media/gif/
              touch "$marker"
              rm -rf "$work_dir"
              echo "Exercise media ready: ${image_count} images, ${gif_count} animations."
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
              ephemeral-storage: 64Mi
            limits:
              memory: 256Mi
              ephemeral-storage: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
          volumeMounts:
            - name: media
              mountPath: /media
      containers:
        - name: api
          image: registry.gitlab.com/duartesantos8/opengym/api:1.2.9@sha256:dc02a697b9984af28d49b18be547ac2a03dba9f23fae2e6ebf2d87ad1b0ee8bc
          imagePullPolicy: IfNotPresent
          env:
            - name: RP_ID
              value: opengym.hometheo.click
            - name: ORIGIN
              value: https://opengym.hometheo.click
            - name: RP_NAME
              value: openGym
            - name: DATA_DIR
              value: /data
            - name: PORT
              value: "3000"
          ports:
            - name: api
              containerPort: 3000
          startupProbe:
            httpGet:
              path: /api/health
              port: api
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet:
              path: /api/health
              port: api
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: api
            periodSeconds: 30
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
          volumeMounts:
            - name: data
              mountPath: /data
        - name: web
          image: registry.gitlab.com/duartesantos8/opengym/web:1.2.9@sha256:c86ff597beb8f3a4083023e60054f48dd857e744ecea7d6d15019ebcba2f84d3
          imagePullPolicy: IfNotPresent
          env:
            - name: NGINX_PORT
              value: "8080"
            - name: BACKEND
              value: 127.0.0.1
            - name: PORT
              value: "3000"
          ports:
            - name: http
              containerPort: 8080
          startupProbe:
            httpGet:
              path: /
              port: http
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 30
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsGroup: 1000
            runAsNonRoot: true
            runAsUser: 101
          volumeMounts:
            - name: media
              mountPath: /usr/share/nginx/html/img
              subPath: img
              readOnly: true
            - name: media
              mountPath: /usr/share/nginx/html/gif
              subPath: gif
              readOnly: true
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d
            - name: nginx-run
              mountPath: /run
            - name: nginx-tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: opengym-data
        - name: media
          persistentVolumeClaim:
            claimName: opengym-media
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-conf
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
        - name: nginx-tmp
          emptyDir: {}
