apiVersion: apps/v1
kind: Deployment
metadata:
  name: uptime-kuma
  namespace: uptime-kuma
  labels:
    helm.sh/chart: uptime-kuma-2.24.0
    app.kubernetes.io/name: uptime-kuma
    app.kubernetes.io/instance: uptime-kuma
    app.kubernetes.io/version: "1.23.17"
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: uptime-kuma
      app.kubernetes.io/instance: uptime-kuma
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: uptime-kuma
        app.kubernetes.io/instance: uptime-kuma
    spec:
      automountServiceAccountToken: false
      serviceAccountName: default
      securityContext: {}
      initContainers:
        - name: retention-cleanup-20260808
          image: louislam/uptime-kuma:1.23.17-debian
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "/maintenance/maintenance.sh"]
          env:
            - name: DATA_DIR
              value: /data
            - name: WORK_DIR
              value: /work
            - name: RETENTION_DAYS
              value: "30"
            - name: SAFETY_BYTES
              value: "16777216"
            - name: MAINTENANCE_ID
              value: retention-30d-20260808
          resources:
            requests:
              cpu: 35m
              memory: 180Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: storage
              mountPath: /data
            - name: maintenance-script
              mountPath: /maintenance
              readOnly: true
            - name: maintenance-work
              mountPath: /work
      containers:
        - name: uptime-kuma
          securityContext: {}
          image: louislam/uptime-kuma:1.23.17-debian
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3001
              protocol: TCP
          volumeMounts:
            - name: storage
              mountPath: /app/data
          livenessProbe:
            initialDelaySeconds: 180
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
            successThreshold: 1
            exec:
              command:
                - extra/healthcheck
          readinessProbe:
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 1
            failureThreshold: 3
            successThreshold: 1
            httpGet:
              path: /
              port: 3001
              scheme: HTTP
          resources:
            limits:
              memory: 180Mi
            requests:
              cpu: 35m
              memory: 180Mi
      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: uptime-kuma-pvc
        - name: maintenance-script
          configMap:
            name: uptime-kuma-maintenance
            defaultMode: 0555
        - name: maintenance-work
          emptyDir:
            sizeLimit: 1Gi
