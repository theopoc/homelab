apiVersion: batch/v1
kind: Job
metadata:
  name: longhorn-targeted-filesystem-trim-20260812
  namespace: longhorn-system
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  backoffLimit: 2
  template:
    metadata:
      labels:
        app.kubernetes.io/name: longhorn-targeted-filesystem-trim
    spec:
      restartPolicy: Never
      containers:
        - name: trim
          image: longhornio/longhorn-manager:v1.10.1
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
          args:
            - |
              api=http://longhorn-backend:9500/v1
              volumes="
              pvc-1ed1345c-4bc0-4eae-b2f5-4d4a11224d14
              pvc-d0b32529-4fc3-4bcb-ae69-90f1b6f7ed14
              "

              for volume in ${volumes}; do
                echo "Enable snapshot-chain removal for ${volume}"
                curl --fail --silent --show-error \
                  --request POST \
                  --header 'Content-Type: application/json' \
                  --data '{"unmapMarkSnapChainRemoved":"enabled"}' \
                  "${api}/volumes/${volume}?action=updateUnmapMarkSnapChainRemoved" \
                  >/dev/null
              done

              for volume in ${volumes}; do
                echo "Trim ${volume}"
                curl --fail --silent --show-error \
                  --request POST \
                  --header 'Content-Type: application/json' \
                  --data '{}' \
                  "${api}/volumes/${volume}?action=trimFilesystem" \
                  >/dev/null
              done
